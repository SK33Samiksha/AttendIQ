<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Subjects — AttendIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shared.css"/>
</head>
<body>
  <div class="sidebar" id="sidebar"></div>
  <div id="toast"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>Add Subject</h3>
      <div class="form-row cols-2">
        <div class="form-group">
          <label>Subject Name *</label>
          <input type="text" id="subName" placeholder="e.g. Java Programming"/>
        </div>
        <div class="form-group">
          <label>Subject Code *</label>
          <input type="text" id="subCode" placeholder="e.g. JAVA"/>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveSubject()">Add Subject</button>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="page-header">
      <div><h1>Subjects</h1><p>Manage course subjects</p></div>
      <button class="btn btn-primary" onclick="openModal()">+ Add Subject</button>
    </div>

    <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:16px;" id="subjectGrid">
      <div class="empty-state"><div class="icon">⏳</div><p>Loading…</p></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if (!requireAuth()) throw 0;
    document.getElementById('sidebar').innerHTML = renderSidebar('subjects');

    const colors = ['#e85d04','#3b82f6','#16a34a','#8b5cf6','#06b6d4','#f59e0b','#ec4899'];

    async function loadSubjects() {
      const res = await apiFetch('/subjects');
      const grid = document.getElementById('subjectGrid');

      if (!res.success || !res.data.length) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="icon">📚</div><p>No subjects yet. Add your first subject.</p></div>';
        return;
      }

      grid.innerHTML = res.data.map((s, i) => {
        const color = colors[i % colors.length];
        return `
          <div style="background:white; border-radius:16px; border:1px solid var(--border);
            padding:24px; box-shadow:0 2px 12px rgba(13,17,23,.05);
            display:flex; align-items:center; gap:16px;
            transition:transform .2s, box-shadow .2s;"
            onmouseenter="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 8px 24px rgba(13,17,23,.1)'"
            onmouseleave="this.style.transform=''; this.style.boxShadow=''">
            <div style="width:52px; height:52px; border-radius:14px; background:${color}15;
              display:grid; place-items:center; font-size:22px; flex-shrink:0; color:${color};">📖</div>
            <div style="flex:1;">
              <div style="font-family:'Syne',sans-serif; font-weight:700; font-size:1rem;">${s.name}</div>
              <div style="font-size:.75rem; color:var(--muted); margin-top:2px;">
                Code: <strong style="color:${color};">${s.code}</strong>
              </div>
            </div>
            <button class="btn btn-danger btn-sm" onclick="deleteSubject(${s.id}, '${s.name}')">Delete</button>
          </div>
        `;
      }).join('');
    }

    function openModal()  { document.getElementById('modalOverlay').classList.add('open'); }
    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      document.getElementById('subName').value = '';
      document.getElementById('subCode').value = '';
    }

    async function saveSubject() {
      const name = document.getElementById('subName').value.trim();
      const code = document.getElementById('subCode').value.trim().toUpperCase();
      if (!name || !code) { showToast('Name and Code are required.', 'error'); return; }

      const res = await apiFetch('/subjects', {
        method: 'POST',
        body: JSON.stringify({ name, code }),
      });
      if (res.success) { showToast('Subject added!', 'success'); closeModal(); loadSubjects(); }
      else showToast(res.message || 'Error.', 'error');
    }

    async function deleteSubject(id, name) {
      if (!confirm(`Delete subject "${name}"?`)) return;
      const res = await apiFetch(`/subjects/${id}`, { method: 'DELETE' });
      if (res.success) { showToast('Subject deleted.', 'success'); loadSubjects(); }
      else showToast(res.message, 'error');
    }

    document.getElementById('modalOverlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });

    loadSubjects();
  </script>
</body>
</html>
