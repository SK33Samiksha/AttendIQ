<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Staff Accounts — AttendIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shared.css"/>
</head>
<body>
  <div class="sidebar" id="sidebar"></div>
  <div id="toast"></div>

  <!-- Add account modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>Add Staff Account</h3>
      <div class="form-row cols-2">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="uName" placeholder="e.g. Prof. Rao"/>
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" id="uEmail" placeholder="name@school.com"/>
        </div>
      </div>
      <div class="form-row cols-2">
        <div class="form-group">
          <label>Password * (min. 8 characters)</label>
          <input type="password" id="uPassword" autocomplete="new-password"/>
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="uRole">
            <option value="teacher">Teacher</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveUser()">Create Account</button>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="page-header">
      <div><h1>Staff Accounts</h1><p>Approve teacher requests and manage who can sign in</p></div>
      <button class="btn btn-primary" onclick="openModal()">+ Add Account</button>
    </div>

    <div class="card" id="pendingCard" style="margin-bottom:20px; display:none;">
      <h3 style="font-size:1rem; font-weight:700; margin-bottom:6px;">Waiting for approval</h3>
      <p style="font-size:.85rem; color:var(--muted); margin-bottom:14px;">
        These teachers requested an account from the sign-in page. Approve the ones you recognise.
      </p>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Requested</th><th>Actions</th></tr></thead>
          <tbody id="pendingBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3 style="font-size:1rem; font-weight:700; margin-bottom:14px;">All accounts</h3>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="userBody">
            <tr><td colspan="6"><div class="empty-state"><div class="icon">⏳</div><p>Loading…</p></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if (!requireAdminPage()) throw 0;
    document.getElementById('sidebar').innerHTML = renderSidebar('users');

    let allUsers = [];
    const me = getUser();

    async function loadUsers() {
      const res = await apiFetch('/users');
      allUsers = res.success ? res.data : [];
      loadPendingBadge();

      // Pending requests
      const pending = allUsers.filter(u => u.status === 'pending');
      document.getElementById('pendingCard').style.display = pending.length ? 'block' : 'none';
      document.getElementById('pendingBody').innerHTML = pending.map(u => `
        <tr>
          <td><strong>${esc(u.name)}</strong></td>
          <td>${esc(u.email)}</td>
          <td>${formatDate(u.created_at)}</td>
          <td style="white-space:nowrap;">
            <button class="btn btn-primary btn-sm" onclick="setStatus(${u.id}, 'active')">Approve</button>
            <button class="btn btn-danger btn-sm" style="margin-left:6px;" onclick="rejectUser(${u.id})">Reject</button>
          </td>
        </tr>`).join('');

      // Everyone else
      const others = allUsers.filter(u => u.status !== 'pending');
      const tbody = document.getElementById('userBody');
      if (!others.length) {
        tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><p>${esc(res.message || 'No accounts yet.')}</p></div></td></tr>`;
        return;
      }
      tbody.innerHTML = others.map((u, i) => {
        const isMe = u.id === me.id;
        const toggle = isMe ? '<span style="font-size:.8rem;color:var(--muted)">(you)</span>'
          : u.status === 'active'
            ? `<button class="btn btn-secondary btn-sm" onclick="setStatus(${u.id}, 'disabled')">Disable</button>`
            : `<button class="btn btn-primary btn-sm" onclick="setStatus(${u.id}, 'active')">Enable</button>`;
        return `
        <tr>
          <td style="color:var(--muted); font-size:.8rem;">${i + 1}</td>
          <td><strong>${esc(u.name)}</strong></td>
          <td>${esc(u.email)}</td>
          <td style="text-transform:capitalize;">${esc(u.role)}</td>
          <td><span class="badge ${esc(u.status)}" style="text-transform:capitalize;">${esc(u.status)}</span></td>
          <td style="white-space:nowrap;">
            ${toggle}
            <button class="btn btn-secondary btn-sm" style="margin-left:6px;" onclick="resetPassword(${u.id})">Reset password</button>
          </td>
        </tr>`;
      }).join('');
    }

    async function setStatus(id, status) {
      const u = allUsers.find(x => x.id === id);
      if (status === 'disabled' && !confirm(`Disable ${u.name}'s account? They will be signed out and cannot sign in until you enable it again. Their attendance records are kept.`)) return;
      const res = await apiFetch(`/users/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status }) });
      showToast(res.message || 'Done.', res.success ? 'success' : 'error');
      loadUsers();
    }

    async function rejectUser(id) {
      const u = allUsers.find(x => x.id === id);
      if (!confirm(`Reject the request from ${u.name} (${u.email})?`)) return;
      const res = await apiFetch(`/users/${id}`, { method: 'DELETE' });
      showToast(res.message || 'Done.', res.success ? 'success' : 'error');
      loadUsers();
    }

    async function resetPassword(id) {
      const u = allUsers.find(x => x.id === id);
      const password = prompt(`New password for ${u.name} (at least 8 characters):`);
      if (password === null) return;
      if (password.length < 8) return showToast('Password must be at least 8 characters.', 'error');
      const res = await apiFetch(`/users/${id}/reset-password`, { method: 'POST', body: JSON.stringify({ password }) });
      showToast(res.message || 'Done.', res.success ? 'success' : 'error');
    }

    function openModal()  { document.getElementById('modalOverlay').classList.add('open'); }
    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      ['uName', 'uEmail', 'uPassword'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('uRole').value = 'teacher';
    }

    async function saveUser() {
      const body = {
        name: document.getElementById('uName').value.trim(),
        email: document.getElementById('uEmail').value.trim(),
        password: document.getElementById('uPassword').value,
        role: document.getElementById('uRole').value,
      };
      if (!body.name || !body.email || !body.password) { showToast('Please fill in all fields.', 'error'); return; }
      if (body.password.length < 8) { showToast('Password must be at least 8 characters.', 'error'); return; }
      const res = await apiFetch('/users', { method: 'POST', body: JSON.stringify(body) });
      if (res.success) { showToast(res.message, 'success'); closeModal(); loadUsers(); }
      else showToast(res.message || 'Could not create the account.', 'error');
    }

    document.getElementById('modalOverlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });
    loadUsers();
  </script>
</body>
</html>
